name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Dependency check
        run: python -m pip check

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy src

      - name: Tests with coverage
        run: pytest --cov=performative_optimization --cov-report=term-missing --cov-fail-under=85

      - name: End-to-end smoke experiment
        run: |
          python scripts/run_benchmark.py \
            --config configs/smoke.json \
            --output smoke_results.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("smoke_results.json").read_text())
          assert payload["records"]
          assert payload["summary"]
          assert payload["paired_differences"]
          assert all(row["feasible"] for row in payload["records"])
          PY
