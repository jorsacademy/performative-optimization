name: ci

on:
  push:
    branches: [main, build/research-benchmark]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Show Ruff canonical import fix
        run: |
          ruff check tests/test_experiment.py --fix
          echo '--- canonical file ---'
          cat tests/test_experiment.py
          echo '--- diff ---'
          git diff -- tests/test_experiment.py
          exit 1
